name: creative-tools

on:
  pull_request:
    paths:
      - deploy/distribution/CreativeRuntime.Dockerfile
      - services/core/deploy/creative/**
      - services/core/deploy/e2b/**
      - .github/workflows/creative-tools.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ${{ vars.OAC_USE_GITHUB_RUNNERS == 'true' && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check E2B packaging
        run: python3 -m unittest discover -s services/core/deploy/e2b -p build_template_test.py
      - name: Build and verify tools
        # This base qualifies tools only, not a native Harness or deployment.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/creative-check"
          chmod 0777 "$RUNNER_TEMP/creative-check"
          docker build --platform linux/amd64 \
            --build-arg RUNTIME_IMAGE=node:22.23.1-bookworm-slim@sha256:8607a9064d4a571140998ae9e52a3b3fcf9cff361d04642d5971e6cd76d39e27 \
            -f deploy/distribution/CreativeRuntime.Dockerfile -t creative-tools:check . \
            2>&1 | tee "$RUNNER_TEMP/creative-check/build.log"
          docker run --rm --entrypoint oac-creative-check \
            -v "$RUNNER_TEMP/creative-check:/outputs" creative-tools:check /outputs \
            2>&1 | tee "$RUNNER_TEMP/creative-check/check.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: creative-tools-smoke
          path: ${{ runner.temp }}/creative-check
          if-no-files-found: error
